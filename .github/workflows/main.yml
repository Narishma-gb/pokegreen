name: CI

on:
  push:
    branches: [ sgb_mon ]
  pull_request:

env:
  rgbds_version: v1.0.3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout rgbds
        uses: actions/checkout@v7
        with:
          path: rgbds
          ref: ${{ env.rgbds_version }}
          repository: gbdev/rgbds

      - name: Install rgbds
        working-directory: rgbds
        run: |
          sudo apt-get update
          sudo apt-get install -yq bison libpng-dev pkg-config
          sudo make -j$(nproc) install

      - name: Remove rgbds
        run: |
          rm -rf rgbds

      - name: Make
        run: |
          make -j$(nproc)
          .github/checkdiff.sh

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout rgbds
        uses: actions/checkout@v7
        with:
          path: rgbds
          ref: ${{ env.rgbds_version }}
          repository: gbdev/rgbds

      - name: Install rgbds
        working-directory: rgbds
        run: |
          brew install bison libpng pkg-config
          export PATH="$(brew --prefix bison)/bin:$PATH"
          sudo make -j$(sysctl -n hw.ncpu) install

      - name: Remove rgbds
        run: |
          rm -rf rgbds

      - name: Make
        run: |
          make -j$(sysctl -n hw.ncpu)
          .github/checkdiff.sh
